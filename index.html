<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vetbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sidebar de navegação + área de trabalho; atendimento em 3 colunas (conversas · chat · copiloto) */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e9efed; --line:#d5dfdb; --fg:#14211f; --muted:#5a6a66;
  --primary:#0d7564; --primary-fg:#ffffff; --primary-soft:#d6eee7;
  --accent:#c98a12; --accent-soft:#fbefd2;
  --danger:#bf3e2c; --danger-soft:#fbe2dd; --ok:#2c8549; --ok-soft:#ddf1e3;
  --bubble-in:#ffffff; --bubble-out:#d8efe8; --wave-off:#b9c9c4;
  --chip-l:91%; --chip-fg-l:28%;
  --shadow:0 1px 2px rgb(20 33 31 / .06), 0 6px 20px rgb(20 33 31 / .07);
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#141e1c; --surface-2:#1a2725; --line:#263532; --fg:#e3ede9; --muted:#93a6a1;
  --primary:#3dbda3; --primary-fg:#05211b; --primary-soft:#163a33;
  --accent:#efb546; --accent-soft:#3a2e16;
  --danger:#f07b66; --danger-soft:#3d1f1a; --ok:#5ccd82; --ok-soft:#163522;
  --bubble-in:#1a2725; --bubble-out:#123f38; --wave-off:#3a4f4b;
  --chip-l:21%; --chip-fg-l:80%;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#141e1c; --surface-2:#1a2725; --line:#263532; --fg:#e3ede9; --muted:#93a6a1;
  --primary:#3dbda3; --primary-fg:#05211b; --primary-soft:#163a33;
  --accent:#efb546; --accent-soft:#3a2e16;
  --danger:#f07b66; --danger-soft:#3d1f1a; --ok:#5ccd82; --ok-soft:#163522;
  --bubble-in:#1a2725; --bubble-out:#123f38; --wave-off:#3a4f4b;
  --chip-l:21%; --chip-fg-l:80%;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .3);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:20px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* Shell */
.app{height:100%;display:grid;grid-template-columns:228px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:18px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center}
.brand b{font-family:var(--f-display);font-size:21px;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--primary-soft);color:var(--fg)}
.nav a.on .ic{color:var(--primary)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:10px;border:1px dashed var(--line);border-radius:var(--r);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.side-foot b{color:var(--fg);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:600;text-align:left;font-size:12px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{margin-right:auto}
.view{flex:1;min-height:0;overflow:auto}
.page{padding-block:20px 40px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:20px;max-width:1240px}

/* Agent mode switch */
.mode{display:flex;align-items:center;gap:8px}
.mode-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg button.on[data-v="auto"]{color:var(--primary)}
.seg button.on[data-v="off"]{color:var(--danger)}

/* Generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--primary-fg);font-size:11.5px;font-weight:700}
.chip{--h:180;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:hsl(var(--h) 45% var(--chip-l));color:hsl(var(--h) 55% var(--chip-fg-l));white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.pill.ai{background:var(--primary-soft);color:var(--primary)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Inbox */
.inbox{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr) 370px;min-height:0;position:relative}
.convs{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.convs-head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.conv-list{overflow:auto;flex:1}
.conv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;border-top:0;border-right:0}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--primary-soft);border-left-color:var(--primary)}
.conv.urgent{border-left-color:var(--danger)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:hsl(var(--h,170) 40% var(--chip-l));color:hsl(var(--h,170) 50% var(--chip-fg-l))}
.conv .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .pv{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--muted)}
.conv .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-head .who{min-width:0;flex:1}
.chat-head .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who span{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.dsep{align-self:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:8px 0}
.bub{max-width:min(78%, 520px);padding:8px 11px 6px;border-radius:12px;background:var(--bubble-in);box-shadow:var(--shadow);align-self:flex-start;display:flex;flex-direction:column;gap:4px;white-space:pre-wrap;word-wrap:break-word}
.bub.out{align-self:flex-end;background:var(--bubble-out)}
.bub .bt{font-size:11px;color:var(--muted);display:flex;gap:6px;justify-content:flex-end;align-items:center;white-space:nowrap}
.bub .by{font-size:11px;font-weight:700;color:var(--primary)}
.bub.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.photo{width:220px;max-width:100%;aspect-ratio:4/3;border-radius:8px;background:linear-gradient(135deg,hsl(35 60% 70%),hsl(20 45% 52%));display:grid;place-items:center;color:#fff;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.transcript{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;white-space:normal}
.player{display:flex;align-items:center;gap:9px;min-width:220px}
.play{width:32px;height:32px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;flex:none}
.play .ic{width:14px;height:14px}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:var(--wave-off)}
.wave i.on{background:var(--primary)}
.dur{font-size:11.5px;color:var(--muted)}

.composer{position:relative;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:6px}
.composer textarea{min-height:42px;max-height:140px;resize:none;border-radius:20px;padding:10px 14px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn.send{background:var(--primary);color:var(--primary-fg)}
.quickpop{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:5}
.quickpop button{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.quickpop button:hover,.quickpop button.on{background:var(--surface-2)}
.quickpop .k{font-family:var(--f-mono);color:var(--primary);font-weight:500}
.quickpop .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);padding:0 14px 8px;background:var(--surface)}

.copilot{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0;display:flex;flex-direction:column}
.cop-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.cop-head h2{font-size:15px;flex:1}
.cop-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.cbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:9px}
.cbox.hl{border-color:var(--primary);background:linear-gradient(var(--primary-soft),var(--primary-soft)) top/100% 3px no-repeat, var(--surface)}
.cbox.alert{border-color:var(--danger);background:var(--danger-soft)}
.cbox.learn{border-color:var(--accent);background:var(--accent-soft)}
.cbox h3{font-size:13.5px;display:flex;align-items:center;gap:6px}
.conf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:3px}
.alt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:none;border-radius:8px;padding:7px 9px;font-size:13px}
.alt:hover{border-color:var(--primary)}
.alt .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.src{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.src .ic{width:15px;height:15px}
.copbtn{display:none}

/* Tables & lists */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12.5px}
.faqs{display:flex;flex-direction:column}
.faq{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.faq:last-child{border-bottom:0}
.faq .q{font-weight:600}
.faq .a{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.freq{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface)}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop .ico{width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.step.done{color:var(--fg)}
.step .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .dot{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cluster{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.cluster:last-child{border-bottom:0}
.examples{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:13px}

/* Flows */
.flows{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.flow-list{display:flex;flex-direction:column;gap:8px}
.fl{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%}
.fl.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.fl b{font-size:14px}
.canvas{padding:18px;overflow-x:auto;background-color:var(--surface);background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:18px 18px}
.seq{display:flex;flex-direction:column;align-items:center;gap:0;min-width:230px}
.node{position:relative;width:250px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.node:hover{border-color:var(--primary)}
.node .nt{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--nc,var(--muted))}
.node .nt .ic{width:14px;height:14px}
.node .nl{font-weight:600;font-size:13.5px}
.node .nd{font-size:12px;color:var(--muted)}
.node.t-trigger{--nc:var(--accent);border-style:dashed}
.node.t-cond{--nc:var(--primary);border-color:var(--primary)}
.node.t-human{--nc:var(--danger)}
.node.t-audio,.node.t-faq,.node.t-quick,.node.t-msg{--nc:var(--ok)}
.conn{width:2px;height:20px;background:var(--line)}
.branches{display:flex;gap:22px;align-items:flex-start;position:relative;padding-top:14px;border-top:2px solid var(--line)}
.branch{display:flex;flex-direction:column;align-items:center}
.blabel{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-bottom:0}
.addn{width:28px;height:28px;border-radius:50%;border:1px dashed var(--muted);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.addn:hover{border-color:var(--primary);color:var(--primary)}
.addn .ic{width:14px;height:14px}
.sug{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--primary-soft);border:1px solid var(--primary)}
.sug .ai{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;flex:none}

/* Media */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acard{padding:14px;display:flex;flex-direction:column;gap:10px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

/* Integrations */
.ints{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.int{padding:16px;display:flex;flex-direction:column;gap:12px}
.int-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.perm{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.perm span{flex:1}
.sw{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgb(10 20 18 / .45);display:grid;place-items:center;z-index:50;padding:16px}

.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}

.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.types button{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;font-weight:600;font-size:13px}
.types button:hover{border-color:var(--primary)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;pointer-events:none;width:min(92vw,460px)}
.t{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

  .inbox{grid-template-columns:280px minmax(0,1fr)}

  .faq{grid-template-columns:1fr auto}
  .faq .freq{display:none}

}

 const rank=S.faqs.map(f=>({f,s:Math.max(faqScore(lc.text,f),faqScore(lc.two,f)*.95)})).sort((a,b)=>b.s-a.s);
 const best=rank[0];const pick=S.alt[c.id]?rank.find(r=>r.f.id===S.alt[c.id])||best:best;
 const c0=conf(best.s);const g1=guessCat(lc.text);const catId=c0>=.45?best.f.cat:(toks(lc.text).some(t=>CATS.some(c=>c.kw.some(k=>t.startsWith(k))))?g1:guessCat(lc.two));

let PL=null;
function stopPlay(){if(!PL)return;cancelAnimationFrame(PL.raf);try{PL.audio&&PL.audio.pause()}catch(e){}document.querySelectorAll(`[data-pid="${PL.id}"]`).forEach(b=>{b.innerHTML=ic('play');const w=b.parentElement.querySelector('.wave');w&&w.querySelectorAll('i').forEach(i=>i.classList.remove('on'))});PL=null}
function togglePlay(el){const id=el.dataset.pid;if(PL&&PL.id===id){stopPlay();return}stopPlay();PL={id,dur:+el.dataset.dur||20,start:performance.now()};if(el.dataset.src){PL.audio=new Audio(el.dataset.src);PL.audio.play().catch(()=>{});PL.audio.onloadedmetadata=()=>{if(PL&&isFinite(PL.audio.duration))PL.dur=PL.audio.duration}}tick()}
function tick(){if(!PL)return;const p=Math.min(1,(performance.now()-PL.start)/1000/PL.dur);document.querySelectorAll(`[data-pid="${PL.id}"]`).forEach(b=>{if(!b.dataset.on){b.innerHTML=ic('pause')}const w=b.parentElement.querySelector('.wave');if(w){const bars=w.querySelectorAll('i');const k=Math.floor(p*bars.length);bars.forEach((x,i)=>x.classList.toggle('on',i<k))}});if(p>=1){stopPlay();return}PL.raf=requestAnimationFrame(tick)}

 'flow-del':()=>{if(S.flows.length<2)return;S.flows=S.flows.filter(f=>f.id!==S.flowSel);S.flowSel=S.flows[0].id;render()},
 'flow-new':()=>openModal(`<div class="mhead"><h2>Nova trilha</h2><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('x')}</button></div><div class="mbody"><label class="f">Nome<input type="text" id="nfl-n" placeholder="Ex.: Banho e tosa"></label><label class="f">Categoria<select id="nfl-c">${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><p class="muted" style="font-size:13px">O Vetbot pode montar um rascunho usando as respostas padrão e os áudios desta categoria. Você revisa antes de ativar.</p></div><div class="mfoot"><button class="btn" data-a="flow-create" data-m="blank">Começar do zero</button><button class="btn pri" data-a="flow-create" data-m="ai">${ic('spark')}Montar com o Vetbot</button></div>`),
 'flow-create':el=>{const c=$('#nfl-c').value;const n=$('#nfl-n').value.trim()||cat(c).name;const f=el.dataset.m==='ai'?genFlow(n,c):{id:uid('f'),name:n,cat:c,status:'sugerida',auto:false,nodes:[withIds({type:'trigger',label:'Pergunta classificada como '+cat(c).name})],sugs:[]};if(el.dataset.m!=='ai')f.status='ativa';S.flows.push(f);S.flowSel=f.id;closeModal();render()},
 // Áudios
 'audio-new':()=>audioModal(null),
 'audio-edit':el=>audioModal(S.audios.find(a=>a.id===el.dataset.id)),
 'audio-save':()=>{const form=$('#audform');const id=form.dataset.id;const t=$('#af-t').value.trim();if(!t){toast('Dê um nome ao áudio');return}const d={title:t,cat:$('#af-c').value,when:$('#af-w').value.trim()||'Definido pelo Vetbot conforme a categoria'};const file=$('#af-file').files[0];const finish=(src,dur)=>{let a;if(id){a=S.audios.find(x=>x.id===id);Object.assign(a,d)}else{a={id:uid('a'),uses:0,by:'Camila (recepção)',dur:30,...d};S.audios.push(a)}if(src){a.src=src;a.dur=dur||a.dur}const q=$('#af-q').value;if(q){S.faqs.forEach(f=>{if(f.audio===a.id)delete f.audio});S.faqs.find(f=>f.id===q).audio=a.id}closeModal();toast('Áudio salvo');render()};
   if(file){if(file.size>4e6){toast('Arquivo grande demais para a demonstração (máx. 4 MB)');return}const r=new FileReader();r.onload=()=>{const au=new Audio(r.result);au.onloadedmetadata=()=>finish(r.result,isFinite(au.duration)?Math.round(au.duration):30);au.onerror=()=>finish(r.result,30)};r.readAsDataURL(file)}else finish()},
 // Rápidas
 'quick-del':el=>{S.quick.splice(+el.dataset.i,1);render()},
 // Integrações
 'int-on':el=>{const s=S.ints[el.dataset.id];s.on=true;s.perm.read=true;toast('Conectado. O Vetbot já pode consultar esses dados.');render()},
 close:()=>closeModal(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.matches('input[type=checkbox]'))return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.matches('[data-a="faq-auto"]')){S.faqs.find(f=>f.id===t.dataset.id).auto=t.checked;toast(t.checked?'Liberada para envio automático':'Só com confirmação');render()}
 else if(t.matches('[data-a="flow-auto"]')){curFlow().auto=t.checked;render()}
 else if(t.matches('[data-a="perm"]')){S.ints[t.dataset.id].perm[t.dataset.p]=t.checked;if(t.dataset.p==='solo'&&t.checked)S.ints[t.dataset.id].perm.act=true;render()}
 else if(t.id==='upfile'){readFiles(t.files)}
 else if(t.id==='ansender'){S.an.clinic=t.value;const x=S.an;runAnalysis(x.txt,x.file)}
 else if(t.id==='f-img'||t.id==='f-aud'){const file=t.files[0];if(!file)return;if(file.size>4e6){toast('Arquivo grande demais para a demonstração (máx. 4 MB)');t.value='';return}const r=new FileReader();const c=curConv();r.onload=()=>{if(t.id==='f-img')pushMsg(c,{f:'k',t:'image',src:r.result,cap:file.name,by:'Camila'});else{pushMsg(c,{f:'k',t:'audio',src:r.result,dur:20,by:'Camila',title:file.name})}t.value='';render()};r.readAsDataURL(file)}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='composer'){S.draft[S.sel]=t.value;const pop=$('#quickpop');if(t.value.startsWith('/')){const q=t.value.slice(1).toLowerCase();const L=S.quick.filter(x=>x.k.slice(1).startsWith(q)||n1(x.t).includes(n1(q)));pop.innerHTML=L.length?L.map((x,i)=>`<button data-a="quick-pick" data-k="${esc(x.k)}" class="${i===0?'on':''}"><span class="k">${esc(x.k)}</span><span class="t">${esc(fill(x.t,curConv().vars))}</span></button>`).join(''):'<div class="empty">Nenhum atalho encontrado</div>';pop.hidden=false}else pop.hidden=true}
 else if(t.id==='sugg'){S.suggEdit[t.dataset.key]=t.value}
 else if(t.id==='kbq'){S.kbQ=t.value;const pos=t.selectionStart;render();const n=$('#kbq');n.focus();n.setSelectionRange(pos,pos)}
 else if(t.id==='manualq'){const q=t.value;const res=q.trim()?S.faqs.map(f=>({f,s:faqScore(q,f)+(n1(f.q+f.a).includes(n1(q))?.3:0)})).sort((a,b)=>b.s-a.s).slice(0,4):[];$('#manualres').innerHTML=res.map(r=>`<button class="alt" data-a="manual" data-id="${r.f.id}" style="margin-top:6px"><span class="grow">${esc(r.f.q)}</span>${chip(r.f.cat)}</button>`).join('')}
});
document.addEventListener('keydown',e=>{if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const pop=$('#quickpop');if(!pop.hidden){const b=pop.querySelector('button');if(b){A['quick-pick'](b);return}}sendText(e.target.value)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='quickform'){let k=$('#qk').value.trim();if(!k.startsWith('/'))k='/'+k;k=k.replace(/\s+/g,'');S.quick.push({k,t:$('#qt').value.trim(),cat:$('#qc').value,n:0});toast('Atalho '+k+' criado');render()}});
function readFiles(files){const arr=[...files];if(!arr.length)return;Promise.all(arr.map(f=>f.text())).then(ts=>runAnalysis(ts.join('\n'),arr.map(f=>f.name).join(', ')))}
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');readFiles(e.dataTransfer.files)}});

render();
</script>

</body>
</html>
