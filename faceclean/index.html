<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Faceclean Atendimento</title>
<meta name="theme-color" content="#0c0b0a">
<style>
/* Faceclean Atendimento: identidade do Faceclean Gestão (ônix, ouro, porcelana, rosé HOF).
   Layout: barra lateral ônix + área de trabalho porcelana; atendimento em 3 colunas (conversas · chat · copiloto) */
:root{
  --onix:#0c0b0a; --ouro:#c9a24a; --ouro-claro:#ecd18e; --ouro-escuro:#8c6a24;
  --side-fg:#cfc8bb; --side-muted:#8a8276; --side-line:#24211e; --side-hover:#1b1917;
  --bg:#f3f2ee; --surface:#ffffff; --surface-2:#efede7; --line:#e4dfd6; --fg:#1a1816; --muted:#6b645a; --faint:#978f83;
  --primary:#a8822f; --primary-text:#86651f; --primary-fg:#1a1408; --primary-soft:rgba(201,162,74,.14);
  --accent:#a86a12; --accent-soft:rgba(201,132,30,.14);
  --danger:#b8483c; --danger-soft:rgba(184,72,60,.11); --ok:#2f7d55; --ok-soft:rgba(47,125,85,.12);
  --hof:#a85d52; --hof-soft:rgba(216,169,161,.28);
  --bubble-in:#ffffff; --bubble-out:#f4ead2; --wave-off:#d3ccc0;
  --chip-l:92%; --chip-fg-l:30%; --chip-s:32%;
  --shadow:0 1px 2px rgba(20,16,10,.04), 0 8px 24px -12px rgba(20,16,10,.14);
  --shadow-pop:0 18px 48px -16px rgba(12,11,10,.38);
  --gold-btn:linear-gradient(180deg,#d6b05a,#b8913b); --gold-btn-h:linear-gradient(180deg,#dfbb66,#c09a45);
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --f-mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1a1917; --surface-2:#282623; --line:#2d2a26; --fg:#efebe3; --muted:#a59d90; --faint:#7a7369;
  --primary:#c9a24a; --primary-text:#ecd18e; --primary-fg:#1a1408; --primary-soft:rgba(201,162,74,.16);
  --accent:#e0a84a; --accent-soft:rgba(224,168,74,.15);
  --danger:#e57d6f; --danger-soft:rgba(229,125,111,.15); --ok:#5fbf8a; --ok-soft:rgba(95,191,138,.14);
  --hof:#e1aea5; --hof-soft:rgba(216,169,161,.16);
  --bubble-in:#201e1c; --bubble-out:#2e2717; --wave-off:#3b3732;
  --chip-l:20%; --chip-fg-l:80%;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1a1917; --surface-2:#282623; --line:#2d2a26; --fg:#efebe3; --muted:#a59d90; --faint:#7a7369;
  --primary:#c9a24a; --primary-text:#ecd18e; --primary-fg:#1a1408; --primary-soft:rgba(201,162,74,.16);
  --accent:#e0a84a; --accent-soft:rgba(224,168,74,.15);
  --danger:#e57d6f; --danger-soft:rgba(229,125,111,.15); --ok:#5fbf8a; --ok-soft:rgba(95,191,138,.14);
  --hof:#e1aea5; --hof-soft:rgba(216,169,161,.16);
  --bubble-in:#201e1c; --bubble-out:#2e2717; --wave-off:#3b3732;
  --chip-l:20%; --chip-fg-l:80%;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--onix)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:20px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* Shell */
.app{height:100%;display:grid;grid-template-columns:228px minmax(0,1fr)}
.side{background:var(--onix);color:var(--side-fg);display:flex;flex-direction:column;padding:0 0 0 env(safe-area-inset-left,0px);min-height:0}
.brand{padding:22px 22px 10px;display:block;text-decoration:none}
.brand svg{width:150px;height:auto;display:block}
.brand small{display:block;margin-top:4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);padding-left:6px}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-size:14px}
.nav a .ic{opacity:.82}
.nav a:hover{background:var(--side-hover);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(201,162,74,.2),rgba(201,162,74,.06));color:var(--ouro-claro)}
.nav a.on .ic{opacity:1}
.nav .badge{margin-left:auto;background:var(--ouro);color:#1a1408}
.side-foot{margin-top:auto;padding:14px 22px max(16px, env(safe-area-inset-bottom,0px));border-top:1px solid var(--side-line);font-size:12px;color:var(--side-muted);display:flex;flex-direction:column;gap:6px}
.side-foot b{color:#e9e3d8;font-weight:600}
.status-pill{display:flex;align-items:center;gap:8px;color:#a59d90}
.status-pill i{width:7px;height:7px;border-radius:50%;background:#5fbf8a;box-shadow:0 0 0 3px rgba(95,191,138,.18)}
.linkbtn{background:none;border:0;padding:0;color:var(--ouro-claro);font-weight:500;text-align:left;font-size:12px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.top .crumb{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-bottom:1px}
.top h1{margin-right:auto;font-size:20px}
.view{flex:1;min-height:0;overflow:auto}
.page{padding-block:20px 40px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:20px;max-width:1240px}

/* Agent mode switch */
.mode{display:flex;align-items:center;gap:8px}
.mode-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg button.on[data-v="auto"]{color:var(--primary-text)}
.seg button.on[data-v="off"]{color:var(--danger)}

/* Generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--gold-btn);border-color:#a8822f;color:var(--primary-fg)}
.btn.pri:hover{background:var(--gold-btn-h)}
.btn.dark{background:var(--onix);border-color:var(--onix);color:var(--ouro-claro)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ouro);color:#1a1408;font-size:11px;font-weight:600}
.chip{--h:180;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-fg-l));white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.pill.ai{background:var(--primary-soft);color:var(--primary-text)}
.pill.hof{background:var(--hof-soft);color:var(--hof)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Inbox */
.inbox{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr) 370px;min-height:0;position:relative}
.convs{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.convs-head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.conv-list{overflow:auto;flex:1}
.conv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;border-top:0;border-right:0}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--primary-soft);border-left-color:var(--ouro)}
.conv.urgent{border-left-color:var(--danger)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:hsl(var(--h,170) 40% var(--chip-l));color:hsl(var(--h,170) 50% var(--chip-fg-l))}
.conv .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .pv{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--muted)}
.conv .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-head .who{min-width:0;flex:1}
.chat-head .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who span{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.dsep{align-self:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:8px 0}
.bub{max-width:min(78%, 520px);padding:8px 11px 6px;border-radius:12px;background:var(--bubble-in);box-shadow:var(--shadow);align-self:flex-start;display:flex;flex-direction:column;gap:4px;white-space:pre-wrap;word-wrap:break-word}
.bub.out{align-self:flex-end;background:var(--bubble-out)}
.bub .bt{font-size:11px;color:var(--muted);display:flex;gap:6px;justify-content:flex-end;align-items:center;white-space:nowrap}
.bub .by{font-size:11px;font-weight:600;color:var(--primary-text)}
.bub.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.photo{width:220px;max-width:100%;aspect-ratio:4/3;border-radius:8px;background:linear-gradient(135deg,hsl(35 60% 70%),hsl(20 45% 52%));display:grid;place-items:center;color:#fff;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.transcript{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;white-space:normal}
.player{display:flex;align-items:center;gap:9px;min-width:220px}
.play{width:32px;height:32px;border-radius:50%;border:0;background:var(--gold-btn);color:var(--primary-fg);display:grid;place-items:center;flex:none}
.play .ic{width:14px;height:14px}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:var(--wave-off)}
.wave i.on{background:var(--ouro)}
.dur{font-size:11.5px;color:var(--muted)}

.composer{position:relative;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:6px}
.composer textarea{min-height:42px;max-height:140px;resize:none;border-radius:20px;padding:10px 14px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn.send{background:var(--gold-btn);color:var(--primary-fg)}
.quickpop{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:5}
.quickpop button{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.quickpop button:hover,.quickpop button.on{background:var(--surface-2)}
.quickpop .k{font-family:var(--f-mono);color:var(--primary-text);font-weight:500}
.quickpop .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);padding:0 14px 8px;background:var(--surface)}

.copilot{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0;display:flex;flex-direction:column}
.cop-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.cop-head h2{font-size:15px;flex:1}
.cop-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.cbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:9px}
.cbox.hl{border-color:var(--primary);background:linear-gradient(var(--primary-soft),var(--primary-soft)) top/100% 3px no-repeat, var(--surface)}
.cbox.alert{border-color:var(--danger);background:var(--danger-soft)}
.cbox.learn{border-color:var(--accent);background:var(--accent-soft)}
.cbox h3{font-size:13.5px;display:flex;align-items:center;gap:6px}
.conf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1}
.bar>span{display:block;height:100%;background:var(--ouro);border-radius:3px}
.alt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:none;border-radius:8px;padding:7px 9px;font-size:13px}
.alt:hover{border-color:var(--primary)}
.alt .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.src{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.src .ic{width:15px;height:15px}
.copbtn{display:none}
.top-brand{display:none;width:70px;height:auto}

/* Tables & lists */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12.5px}
.faqs{display:flex;flex-direction:column}
.faq{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.faq:last-child{border-bottom:0}
.faq .q{font-weight:600}
.faq .a{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.freq{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.filters button.on{background:var(--onix);color:var(--ouro-claro);border-color:var(--onix)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface)}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop .ico{width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.step.done{color:var(--fg)}
.step .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .dot{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cluster{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.cluster:last-child{border-bottom:0}
.examples{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:13px}

/* Flows */
.flows{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.flow-list{display:flex;flex-direction:column;gap:8px}
.fl{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%}
.fl.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.fl b{font-size:14px}
.canvas{padding:18px;overflow-x:auto;background-color:var(--surface);background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:18px 18px}
.seq{display:flex;flex-direction:column;align-items:center;gap:0;min-width:230px}
.node{position:relative;width:250px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.node:hover{border-color:var(--primary)}
.node .nt{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--nc,var(--muted))}
.node .nt .ic{width:14px;height:14px}
.node .nl{font-weight:600;font-size:13.5px}
.node .nd{font-size:12px;color:var(--muted)}
.node.t-trigger{--nc:var(--accent);border-style:dashed}
.node.t-cond{--nc:var(--primary);border-color:var(--primary)}
.node.t-human{--nc:var(--danger)}
.node.t-audio,.node.t-faq,.node.t-quick,.node.t-msg{--nc:var(--ok)}
.conn{width:2px;height:20px;background:var(--line)}
.branches{display:flex;gap:22px;align-items:flex-start;position:relative;padding-top:14px;border-top:2px solid var(--line)}
.branch{display:flex;flex-direction:column;align-items:center}
.blabel{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-bottom:0}
.addn{width:28px;height:28px;border-radius:50%;border:1px dashed var(--muted);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.addn:hover{border-color:var(--primary);color:var(--primary)}
.addn .ic{width:14px;height:14px}
.sug{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--primary-soft);border:1px solid var(--primary)}
.sug .ai{width:30px;height:30px;border-radius:8px;background:var(--onix);color:var(--ouro);display:grid;place-items:center;flex:none}

/* Media */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acard{padding:14px;display:flex;flex-direction:column;gap:10px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

/* Integrations */
.ints{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.int{padding:16px;display:flex;flex-direction:column;gap:12px}
.int-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.perm{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.perm span{flex:1}
.sw{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.sw:checked{background:var(--primary)}
.sw:checked::after{transform:translateX(14px)}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(12,11,10,.48);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h2{flex:1}
.mbody{padding:16px;display:flex;flex-direction:column;gap:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.types button{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;font-weight:600;font-size:13px}
.types button:hover{border-color:var(--primary)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;pointer-events:none;width:min(92vw,460px)}
.t{background:var(--onix);color:#efebe3;padding:11px 14px;border-radius:10px;font-weight:500;font-size:13.5px;box-shadow:var(--shadow-pop);border-left:3px solid var(--ouro);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* Responsive */
@media (max-width:1199px){
  .inbox{grid-template-columns:280px minmax(0,1fr)}
  .copilot{position:absolute;right:0;top:0;bottom:0;width:min(380px,100%);box-shadow:var(--shadow);z-index:6;display:none}
  .inbox.show-cop .copilot{display:flex}
  .copbtn{display:inline-flex}
}
@media (max-width:980px){
  .flows{grid-template-columns:1fr}
  .cluster{grid-template-columns:1fr}
}
@media (max-width:819px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--side-line);gap:0}
  .nav{padding:0}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;overflow-x:auto;gap:0}
  .nav a{flex:1 0 auto;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;position:relative;color:var(--side-fg)}
  .nav .badge{position:absolute;top:2px;right:6px;min-width:16px;height:16px;font-size:10px;margin:0}
  .main{padding-bottom:calc(58px + env(safe-area-inset-bottom, 0px))}
  .top{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .top-brand{display:block!important}
  .mode-label{display:none}
  .page{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .inbox{grid-template-columns:1fr}
  .inbox>.convs,.inbox>.chat,.inbox>.copilot{display:none}
  .inbox.pane-list>.convs,.inbox.pane-chat>.chat{display:flex}
  .inbox.pane-cop>.copilot{display:flex;position:static;width:auto;box-shadow:none;border-left:0}
  .faq{grid-template-columns:1fr auto}
  .faq .freq{display:none}
  .hint{display:none}
}
@media (min-width:820px){ .backbtn{display:none} }

function tri(s){const g=new Set();const x=' '+toks(s).join(' ')+' ';for(let i=0;i<x.length-2;i++)g.add(x.slice(i,i+3));return g}
function sim(a,b){const A=new Set(toks(a)),B=new Set(toks(b));if(!A.size||!B.size)return 0;let i=0;A.forEach(t=>B.has(t)&&i++);const dice=2*i/(A.size+B.size);const TA=tri(a),TB=tri(b);let j=0;TA.forEach(t=>TB.has(t)&&j++);const cos=j/Math.sqrt(TA.size*TB.size||1);return .65*dice+.35*cos}

let S;
const KEY='faceclean-atendimento-v1';
function load(){try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(seed(),JSON.parse(r));return}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ============ Navegação ============ */
const ROUTES=[
 ['atendimento','Atendimento','chat'],['conhecimento','Base de respostas','book'],['trilhas','Trilhas','flow'],
 ['audios','Áudios e mídias','mic'],['rapidas','Mensagens rápidas','zap'],['integracoes','Integrações','plug']
];
const route=()=>{const h=location.hash.slice(1);return ROUTES.some(r=>r[0]===h)?h:'atendimento'};
function renderNav(){
 const r=route();const unread=S.convs.reduce((a,c)=>a+(c.unread||0),0);
 $('#nav').innerHTML=ROUTES.map(([id,name,i])=>`<a href="#${id}" class="${r===id?'on':''}">${ic(i)}<span>${name}</span>${id==='atendimento'&&unread?`<span class="badge">${unread}</span>`:''}</a>`).join('');
 document.querySelectorAll('#modeSeg button').forEach(b=>{b.classList.toggle('on',b.dataset.v===S.mode);b.setAttribute('aria-checked',b.dataset.v===S.mode)});
 const R=ROUTES.find(x=>x[0]===r);$('#titleTxt').textContent=R[1];
 $('#topx').innerHTML=r==='atendimento'?`<button class="btn sm" data-a="simulate">${ic('plus')}Simular mensagem de cliente</button>`:'';
}
function render(){renderNav();const r=route();const v=$('#view');
 v.innerHTML=({atendimento:vInbox,conhecimento:vKb,trilhas:vFlows,audios:vMedia,rapidas:vQuick,integracoes:vInts})[r]();
 if(r==='atendimento'){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;const ta=$('#composer');if(ta)ta.value=S.draft[S.sel]||''}
 save();
}
window.addEventListener('hashchange',()=>{$('#view').scrollTop=0;render()});

/* ============ Atendimento ============ */
const curConv=()=>S.convs.find(c=>c.id===S.sel)||S.convs[0];
const initials=n=>n.split(' ').map(p=>p[0]).slice(0,2).join('');
function lastClient(c){const ms=c.msgs.filter(m=>m.f==='c');const last=ms[ms.length-1];if(!last)return null;const txt=m=>m.t==='audio'?(m.tr||''):(m.x||'');const lastIdx=c.msgs.lastIndexOf(last);const t0=txt(last);const pending=lastIdx===c.msgs.length-1&&(t0.includes('?')||t0.length>28||last.t==='audio');return {text:txt(last),two:ms.slice(-2).map(txt).join(' '),pending}}
function analyze(c){
 const lc=lastClient(c);if(!lc||!lc.pending)return {pending:false};
 const rank=S.faqs.map(f=>({f,s:Math.max(faqScore(lc.text,f),faqScore(lc.two,f)*.75)})).sort((a,b)=>b.s-a.s);
 const best=rank[0];const pick=S.alt[c.id]?rank.find(r=>r.f.id===S.alt[c.id])||best:best;
 const c0=conf(best.s);const g1=guessCat(lc.text);const catId=c0>=.45?best.f.cat:(toks(lc.text).some(t=>CATS.some(c=>c.kw.some(k=>t.startsWith(k))))?g1:guessCat(lc.two));
 return {pending:true,text:lc.text,rank,best,pick,conf:c0,match:c0>=.45,cat:catId,urgent:catId==='urg'&&c0>=.45||URGRX.test(n1(lc.text))};
}
function convPreview(c){const m=c.msgs[c.msgs.length-1];if(!m)return'';const p=m.f==='k'?(m.auto?'IA: ':'Você: '):'';return p+(m.t==='image'?'Foto':m.t==='audio'?'Áudio '+fmtDur(m.dur||0):m.x)}
function vInbox(){
 const convs=[...S.convs].sort((a,b)=>b.ts-a.ts);const c=curConv();
 const cls=['inbox','pane-'+(S.pane||'list'),S.showCop?'show-cop':''].join(' ');
 return `<div class="${cls}">
 <section class="convs" aria-label="Conversas">
  <div class="convs-head"><div class="row"><b class="grow">Conversas</b><span class="pill ok">${ic('phone')}WhatsApp conectado</span></div></div>
  <div class="conv-list">${convs.map(x=>{const an=analyze(x);const last=x.msgs[x.msgs.length-1];return `<button class="conv ${x.id===c.id?'on':''} ${an.urgent?'urgent':''}" data-a="sel" data-id="${x.id}">
   <span class="av" style="--h:${x.h}">${esc(initials(x.tutor))}</span>
   <span style="min-width:0"><span class="nm">${esc(x.tutor)}</span><span class="pv" style="display:block">${esc(convPreview(x))}</span>
   <span class="tags">${an.pending?(an.urgent?'<span class="pill bad">Urgente</span>':chip(an.cat)):'<span class="pill neu">Respondida</span>'}${last&&last.auto?'<span class="pill ai">IA</span>':''}</span></span>
   <span class="meta"><span>${esc(last?last.at:'')}</span>${x.unread?`<span class="badge">${x.unread}</span>`:''}</span></button>`}).join('')}</div>
 </section>
 <section class="chat" aria-label="Conversa">${vChat(c)}</section>
 <aside class="copilot" aria-label="Assistente IA">${vCopilot(c)}</aside>
 </div>`;
}
function msgHTML(m,c){
 let body='';
 if(m.t==='text')body=esc(m.x);
 else if(m.t==='image')body=`<div class="photo">${m.src?`<img src="${m.src}" alt="Imagem enviada">`:ic('image')}</div><span class="dur">${esc(m.cap||'imagem.jpg')}</span>`;
 else if(m.t==='audio'){const pid='m'+(m.id||(m.id=uid('m')));body=`<div class="player"><button class="play" data-a="play" data-pid="${pid}" data-dur="${m.dur||20}" ${m.src?`data-src="${m.src}"`:''} aria-label="Ouvir áudio">${ic('play')}</button>${wave(pid,30)}<span class="dur mono">${fmtDur(m.dur||20)}</span></div>${m.title?`<span class="dur">Áudio padrão: ${esc(m.title)}</span>`:''}${m.tr?`<span class="transcript"><b>Transcrição automática:</b> ${esc(m.tr)}</span>`:''}`}
 const by=m.f==='k'?(m.auto?'Assistente IA · automático':(m.by||'Você')+(m.sugg?' · sugestão da IA':'')):'';
 return `<div class="bub ${m.f==='k'?'out':''} ${m.flash?'flash':''}">${by?`<span class="by">${esc(by)}</span>`:''}${body}<span class="bt">${esc(m.at)}${m.f==='k'?' ✓✓':''}</span></div>`;
}
function vChat(c){
 let d='';const ms=c.msgs.map(m=>{let s='';if(m.d!==d){d=m.d;s+=`<div class="dsep">${esc(d)}</div>`}const h=s+msgHTML(m,c);m.flash=false;return h}).join('');
 return `<div class="chat-head"><button class="iconbtn backbtn" data-a="pane" data-v="list" aria-label="Voltar">${ic('back')}</button>
  <span class="av" style="--h:${c.h}">${esc(initials(c.tutor))}</span>
  <div class="who"><b>${esc(c.tutor)}</b><span>${esc(c.pet)} · ${esc(c.petDesc)} · <span class="mono">${esc(c.phone)}</span></span></div>
  <button class="btn sm copbtn" data-a="cop" aria-label="Abrir copiloto">${ic('spark')}Copiloto</button></div>
 <div class="msgs" id="msgs">${ms}</div>
 <div class="composer" id="composerWrap"><div class="quickpop" id="quickpop" hidden></div>
  <button class="iconbtn" data-a="attach-img" aria-label="Enviar imagem">${ic('image')}</button>
  <button class="iconbtn" data-a="attach-aud" aria-label="Enviar áudio">${ic('mic')}</button>
  <textarea id="composer" rows="1" placeholder="Mensagem (digite / para atalhos)"></textarea>
  <button class="iconbtn send" data-a="send" aria-label="Enviar">${ic('send')}</button></div>

/* ============ Player (simulado; arquivos enviados tocam de verdade) ============ */
let PL=null;
function stopPlay(){if(!PL)return;cancelAnimationFrame(PL.raf);try{PL.audio&&PL.audio.pause()}catch(e){}document.querySelectorAll(`[data-pid="${PL.id}"]`).forEach(b=>{b.innerHTML=ic('play');const w=b.parentElement.querySelector('.wave');w&&w.querySelectorAll('i').forEach(i=>i.classList.remove('on'))});PL=null}
function togglePlay(el){const id=el.dataset.pid;if(PL&&PL.id===id){stopPlay();return}stopPlay();PL={id,dur:+el.dataset.dur||20,start:performance.now()};if(el.dataset.src){PL.audio=new Audio(el.dataset.src);PL.audio.play().catch(()=>{});PL.audio.onloadedmetadata=()=>{if(PL&&isFinite(PL.audio.duration))PL.dur=PL.audio.duration}}tick()}
function tick(){if(!PL)return;const p=Math.min(1,(performance.now()-PL.start)/1000/PL.dur);document.querySelectorAll(`[data-pid="${PL.id}"]`).forEach(b=>{if(!b.dataset.on){b.innerHTML=ic('pause')}const w=b.parentElement.querySelector('.wave');if(w){const bars=w.querySelectorAll('i');const k=Math.floor(p*bars.length);bars.forEach((x,i)=>x.classList.toggle('on',i<k))}});if(p>=1){stopPlay();return}PL.raf=requestAnimationFrame(tick)}

/* ============ Ações ============ */
const A={
 mode:el=>{S.mode=el.dataset.v;S.learn=null;toast({copiloto:'Copiloto: o assistente sugere e você confirma.',auto:'Automático: o assistente responde sozinho nas respostas liberadas.',off:'Agente desligado: você responde manualmente.'}[S.mode]);render()},
 reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();stopPlay();render();toast('Dados de exemplo restaurados')},
 sel:el=>{S.sel=el.dataset.id;const c=curConv();c.unread=0;S.pane='chat';render()},
 pane:el=>{S.pane=el.dataset.v;render()},
 cop:()=>{if(matchMedia('(max-width:819px)').matches)S.pane='cop';else S.showCop=!S.showCop;render()},
 'cop-close':()=>{if(matchMedia('(max-width:819px)').matches)S.pane='chat';S.showCop=false;render()},
 alt:el=>{S.alt[S.sel]=el.dataset.id;render()},
 'alt-force':el=>{const f=S.faqs.find(x=>x.id===el.dataset.id);const ta=$('#composer');ta.value=fill(f.a,curConv().vars);S.draft[S.sel]=ta.value;ta.focus()},
 'use-sugg':()=>{const ta=$('#composer');ta.value=$('#sugg').value;S.draft[S.sel]=ta.value;ta.focus()},
 'send-sugg':el=>{sendText($('#sugg').value,{faq:el.dataset.f})},
 'send-audio':el=>{const a=S.audios.find(x=>x.id===el.dataset.id);const c=curConv();pushMsg(c,{f:'k',t:'audio',dur:a.dur,title:a.title,by:'Letícia',sugg:true,src:a.src});a.uses++;toast('Áudio enviado: '+a.title);render()},
 send:()=>{const ta=$('#composer');sendText(ta.value)},
 '2via':()=>{S.confirm2via=S.sel;render()},
 '2via-no':()=>{S.confirm2via=null;render()},
 '2via-ok':()=>{const c=curConv();c.vars.link='pag.faceclean.com.br/p/orc-0006-1';c.vars.valor='R$ 1.632,53';c.ctx.bank.push(['Novo link','R$ 1.632,53 · vence 17/11 · gerado agora']);S.confirm2via=null;Object.keys(S.suggEdit).forEach(k=>k.startsWith(c.id+':')&&delete S.suggEdit[k]);toast('Link de pagamento gerado e inserido na resposta');render()},
 notify:()=>{const c=curConv();toast((PROF_URG[c.id]||'Dra. Camila Souza')+' avisada: vai ligar para a paciente agora')},
 toast:el=>toast(el.dataset.m),
 simulate:()=>incoming(),
 'learn-up':()=>{const L=S.learn;const f=S.faqs.find(x=>x.id===L.faqId);if(f){f.a=L.text;toast('Resposta padrão atualizada')}S.learn=null;render()},
 'learn-skip':()=>{S.learn=null;render()},
 'learn-save':()=>{const L=S.learn;const ct=$('#learncat').value;S.faqs.push({id:uid('q'),cat:ct,q:L.q.charAt(0).toUpperCase()+L.q.slice(1),vars:[],a:L.text,n:1,auto:false});S.learn=null;toast('Salva na base em '+cat(ct).name);render()},
 'attach-img':()=>$('#f-img').click(),
 'attach-aud':()=>$('#f-aud').click(),
 'quick-pick':el=>{const q=S.quick.find(x=>x.k===el.dataset.k);const ta=$('#composer');ta.value=fill(q.t,curConv().vars);q.n++;S.draft[S.sel]=ta.value;$('#quickpop').hidden=true;ta.focus()},
 play:el=>togglePlay(el),
 manual:el=>{const f=S.faqs.find(x=>x.id===el.dataset.id);const ta=$('#composer');ta.value=fill(f.a,curConv().vars);S.draft[S.sel]=ta.value;ta.focus()},
 // Base
 sample:()=>runAnalysis(SAMPLE,'exemplo_whatsapp_faceclean.txt'),
 'an-close':()=>{S.an=null;render()},
 'cl-ok':el=>{approveCluster(+el.dataset.i);toast('Resposta padrão adicionada');render()},
 'cl-no':el=>{S.an.result.clusters[+el.dataset.i].status='no';render()},
 'cl-all':()=>{S.an.result.clusters.forEach((c,i)=>approveCluster(i));toast('Todas as sugestões foram adicionadas à base');render()},
 kbcat:el=>{S.kbCat=el.dataset.c;render()},
 'faq-new':()=>faqModal(null),
 'faq-edit':el=>faqModal(S.faqs.find(f=>f.id===el.dataset.id)),
 'faq-save':()=>{const id=$('#faqform').dataset.id;const q=$('#ff-q').value.trim(),a=$('#ff-a').value.trim();if(!q||!a){toast('Preencha a pergunta e a resposta');return}const d={q,a,cat:$('#ff-c').value,vars:$('#ff-v').value.split('\n').map(s=>s.trim()).filter(Boolean),audio:$('#ff-au').value||undefined};if(id)Object.assign(S.faqs.find(f=>f.id===id),d);else S.faqs.push({id:uid('q'),n:0,auto:false,...d});closeModal();toast('Resposta padrão salva');render()},
 'faq-del':el=>{S.faqs=S.faqs.filter(f=>f.id!==el.dataset.id);closeModal();toast('Resposta excluída');render()},
 // Trilhas
 flow:el=>{S.flowSel=el.dataset.id;render()},
 node:el=>nodeModal(el.dataset.id),
 'node-save':el=>{const f=curFlow();const r=findNode(f.nodes,el.dataset.id);const n=r.n;n.label=$('#nf-l').value.trim()||n.label;n.detail=$('#nf-d').value.trim();const rs=$('#nf-ref');if(rs)n.ref=rs.value;const bs=$('#nf-b');if(bs&&n.branches){const labels=bs.value.split('\n').map(s=>s.trim()).filter(Boolean);n.branches=labels.map((l,i)=>n.branches[i]?Object.assign(n.branches[i],{label:l}):{id:uid('b'),label:l,nodes:[]})}closeModal();render()},
 'node-del':el=>{const f=curFlow();const r=findNode(f.nodes,el.dataset.id);r.arr.splice(r.arr.indexOf(r.n),1);closeModal();render()},
 addn:el=>{const seq=el.dataset.seq;openModal(`<div class="mhead"><h2>Adicionar etapa</h2><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('x')}</button></div><div class="mbody"><div class="types">${Object.entries(NT).map(([k,[n,i]])=>`<button data-a="addtype" data-t="${k}" data-seq="${seq}">${ic(i)}${n}</button>`).join('')}</div></div>`)},
 addtype:el=>{const f=curFlow();const t=el.dataset.t;const seq=el.dataset.seq==='root'?f.nodes:findSeq(f.nodes,el.dataset.seq);const n={id:uid(),type:t,label:NT[t][0]};if(t==='cond'){n.label='Nova condição?';n.branches=[{id:uid('b'),label:'Sim',nodes:[]},{id:uid('b'),label:'Não',nodes:[]}]}if(t==='audio')n.ref=S.audios[0].id;if(t==='faq')n.ref=S.faqs[0].id;if(t==='quick')n.ref=S.quick[0].k;seq.push(n);closeModal();render();nodeModal(n.id)},
 'sug-ok':el=>{const f=curFlow();const s=f.sugs[+el.dataset.i];const seq=s.seq==='root'?f.nodes:findSeq(f.nodes,s.seq);if(seq)seq.push(withIds(JSON.parse(JSON.stringify(s.node))));f.sugs.splice(+el.dataset.i,1);toast('Sugestão aplicada à trilha');render()},
 'sug-no':el=>{curFlow().sugs.splice(+el.dataset.i,1);toast('Sugestão recusada. O assistente não vai repeti-la.');render()},
 'flow-ok':()=>{const f=curFlow();f.status='ativa';toast('Trilha ativada');render()},
 'flow-del':()=>{if(S.flows.length<2)return;S.flows=S.flows.filter(f=>f.id!==S.flowSel);S.flowSel=S.flows[0].id;render()},
 'flow-new':()=>openModal(`<div class="mhead"><h2>Nova trilha</h2><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('x')}</button></div><div class="mbody"><label class="f">Nome<input type="text" id="nfl-n" placeholder="Ex.: Banho e tosa"></label><label class="f">Categoria<select id="nfl-c">${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><p class="muted" style="font-size:13px">O assistente pode montar um rascunho usando as respostas padrão e os áudios desta categoria. Você revisa antes de ativar.</p></div><div class="mfoot"><button class="btn" data-a="flow-create" data-m="blank">Começar do zero</button><button class="btn pri" data-a="flow-create" data-m="ai">${ic('spark')}Montar com o assistente</button></div>`),
 'flow-create':el=>{const c=$('#nfl-c').value;const n=$('#nfl-n').value.trim()||cat(c).name;const f=el.dataset.m==='ai'?genFlow(n,c):{id:uid('f'),name:n,cat:c,status:'sugerida',auto:false,nodes:[withIds({type:'trigger',label:'Pergunta classificada como '+cat(c).name})],sugs:[]};if(el.dataset.m!=='ai')f.status='ativa';S.flows.push(f);S.flowSel=f.id;closeModal();render()},
 // Áudios
 'audio-new':()=>audioModal(null),
 'audio-edit':el=>audioModal(S.audios.find(a=>a.id===el.dataset.id)),
 'audio-save':()=>{const form=$('#audform');const id=form.dataset.id;const t=$('#af-t').value.trim();if(!t){toast('Dê um nome ao áudio');return}const d={title:t,cat:$('#af-c').value,when:$('#af-w').value.trim()||'Definido pelo assistente conforme a categoria'};const file=$('#af-file').files[0];const finish=(src,dur)=>{let a;if(id){a=S.audios.find(x=>x.id===id);Object.assign(a,d)}else{a={id:uid('a'),uses:0,by:'Letícia (recepção)',dur:30,...d};S.audios.push(a)}if(src){a.src=src;a.dur=dur||a.dur}const q=$('#af-q').value;if(q){S.faqs.forEach(f=>{if(f.audio===a.id)delete f.audio});S.faqs.find(f=>f.id===q).audio=a.id}closeModal();toast('Áudio salvo');render()};
   if(file){if(file.size>4e6){toast('Arquivo grande demais para a demonstração (máx. 4 MB)');return}const r=new FileReader();r.onload=()=>{const au=new Audio(r.result);au.onloadedmetadata=()=>finish(r.result,isFinite(au.duration)?Math.round(au.duration):30);au.onerror=()=>finish(r.result,30)};r.readAsDataURL(file)}else finish()},
 // Rápidas
 'quick-del':el=>{S.quick.splice(+el.dataset.i,1);render()},
 // Integrações
 'int-on':el=>{const s=S.ints[el.dataset.id];s.on=true;s.perm.read=true;toast('Conectado. O assistente já pode consultar esses dados.');render()},
 close:()=>closeModal(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.matches('input[type=checkbox]'))return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.matches('[data-a="faq-auto"]')){S.faqs.find(f=>f.id===t.dataset.id).auto=t.checked;toast(t.checked?'Liberada para envio automático':'Só com confirmação');render()}
 else if(t.matches('[data-a="flow-auto"]')){curFlow().auto=t.checked;render()}
 else if(t.matches('[data-a="perm"]')){S.ints[t.dataset.id].perm[t.dataset.p]=t.checked;if(t.dataset.p==='solo'&&t.checked)S.ints[t.dataset.id].perm.act=true;render()}
 else if(t.id==='upfile'){readFiles(t.files)}
 else if(t.id==='ansender'){S.an.clinic=t.value;const x=S.an;runAnalysis(x.txt,x.file)}
 else if(t.id==='f-img'||t.id==='f-aud'){const file=t.files[0];if(!file)return;if(file.size>4e6){toast('Arquivo grande demais para a demonstração (máx. 4 MB)');t.value='';return}const r=new FileReader();const c=curConv();r.onload=()=>{if(t.id==='f-img')pushMsg(c,{f:'k',t:'image',src:r.result,cap:file.name,by:'Letícia'});else{pushMsg(c,{f:'k',t:'audio',src:r.result,dur:20,by:'Letícia',title:file.name})}t.value='';render()};r.readAsDataURL(file)}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='composer'){S.draft[S.sel]=t.value;const pop=$('#quickpop');if(t.value.startsWith('/')){const q=t.value.slice(1).toLowerCase();const L=S.quick.filter(x=>x.k.slice(1).startsWith(q)||n1(x.t).includes(n1(q)));pop.innerHTML=L.length?L.map((x,i)=>`<button data-a="quick-pick" data-k="${esc(x.k)}" class="${i===0?'on':''}"><span class="k">${esc(x.k)}</span><span class="t">${esc(fill(x.t,curConv().vars))}</span></button>`).join(''):'<div class="empty">Nenhum atalho encontrado</div>';pop.hidden=false}else pop.hidden=true}
 else if(t.id==='sugg'){S.suggEdit[t.dataset.key]=t.value}
 else if(t.id==='kbq'){S.kbQ=t.value;const pos=t.selectionStart;render();const n=$('#kbq');n.focus();n.setSelectionRange(pos,pos)}
 else if(t.id==='manualq'){const q=t.value;const res=q.trim()?S.faqs.map(f=>({f,s:faqScore(q,f)+(n1(f.q+f.a).includes(n1(q))?.3:0)})).sort((a,b)=>b.s-a.s).slice(0,4):[];$('#manualres').innerHTML=res.map(r=>`<button class="alt" data-a="manual" data-id="${r.f.id}" style="margin-top:6px"><span class="grow">${esc(r.f.q)}</span>${chip(r.f.cat)}</button>`).join('')}
});
document.addEventListener('keydown',e=>{if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const pop=$('#quickpop');if(!pop.hidden){const b=pop.querySelector('button');if(b){A['quick-pick'](b);return}}sendText(e.target.value)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='quickform'){let k=$('#qk').value.trim();if(!k.startsWith('/'))k='/'+k;k=k.replace(/\s+/g,'');S.quick.push({k,t:$('#qt').value.trim(),cat:$('#qc').value,n:0});toast('Atalho '+k+' criado');render()}});
function readFiles(files){const arr=[...files];if(!arr.length)return;Promise.all(arr.map(f=>f.text())).then(ts=>runAnalysis(ts.join('\n'),arr.map(f=>f.name).join(', ')))}
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');readFiles(e.dataTransfer.files)}});

/* Logo: sem brilho animado para quem prefere menos movimento */
try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.brilho').forEach(e=>e.remove())}catch(e){}
render();
</script>

</body>
</html>
